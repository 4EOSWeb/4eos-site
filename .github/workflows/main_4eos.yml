# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - 4eos

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      # Dev-only packages (playwright, sharp, potrace, eslint, ...) are not
      # needed at runtime. Pruning them keeps the deploy small and fast.
      - name: Remove dev dependencies
        run: npm prune --omit=dev

      # Zip so the upload/download moves one file instead of tens of thousands.
      - name: Package app
        run: |
          zip -qr release.zip . \
            -x '.git/*' '.github/*' 'scripts/*' 'data/*' '.env*' \
               'CHAT-HISTORY.txt' 'Caddyfile' 'start-site.*'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2ECDF9345DEC4B1783E4FFE4FFD79A67 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A846694AED6943C6AEA675739436E0B8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A76087D31C5A42338D6A98863B7DE35F }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: '4eos'
          slot-name: 'Production'
          package: release.zip

      # Fails the run if the site isn't actually serving after the deploy,
      # so a broken release shows up as a red X instead of a silent outage.
      - name: Check the live site
        env:
          SITE: https://4eos-hdcccqcqauc2b8hm.northcentralus-01.azurewebsites.net
        run: |
          for path in / /services /llms.txt /feed.xml; do
            for attempt in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$SITE$path" || true)
              [ "$code" = "200" ] && break
              echo "$path returned $code, retrying in 15s ($attempt/12)"
              sleep 15
            done
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$SITE/analytics")
          echo "/analytics -> $code (307 = login is configured, 404 = ANALYTICS_USER/PASSWORD not set)"
          [ "$code" = "404" ] && echo "::warning::/analytics returned 404 - set ANALYTICS_USER and ANALYTICS_PASSWORD on the 4eos web app"
          exit 0
