# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - 4eosmainsite

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      # Dev-only packages (playwright, sharp, potrace, eslint, ...) are not
      # needed at runtime. Pruning them keeps the deploy small and fast.
      - name: Remove dev dependencies
        run: npm prune --omit=dev

      # Zip so the upload/download moves one file instead of tens of thousands.
      - name: Package app
        run: |
          zip -qr release.zip . \
            -x '.git/*' '.github/*' 'scripts/*' 'data/*' '.env*' \
               'CHAT-HISTORY.txt' 'Caddyfile' 'start-site.*'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8542CBD116B94E76923BA61417420191 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_35F995A1D1584E249E4E28D62503BC7D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_45338D48AC194363AED0790EE62AB421 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: '4eosmainsite'
          slot-name: 'Production'
          package: release.zip
